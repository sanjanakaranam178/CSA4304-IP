<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Ticket Booking System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
}

header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
font-size:34px;
font-weight:bold;
}

nav{
display:flex;
justify-content:center;
background:#1565c0;
}

nav a{
color:white;
padding:15px 20px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
background:#ff9800;
}

.hero{
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957');
background-size:cover;
background-position:center;
height:450px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:50px;
}

.hero p{
font-size:22px;
margin:15px;
}

.container{
width:90%;
margin:auto;
padding:40px;
}

form{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px gray;
max-width:500px;
margin:auto;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#1565c0;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.card{
background:white;
padding:20px;
margin:20px 0;
border-radius:10px;
box-shadow:0 4px 10px lightgray;
}

footer{
background:#0d47a1;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>

</head>

<body>

<header>
🚌 Online Bus Ticket Booking System
</header>

<nav>
<a href="#">Home</a>
<a href="#">Search Bus</a>
<a href="#">Book Ticket</a>
<a href="#">Login</a>
<a href="#">Register</a>
<a href="#">Admin</a>
<a href="#">Contact</a>
</nav>

<div class="hero">
<h1>Book Your Journey Easily</h1>
<p>Search Buses • Select Seats • Book Online</p>
</div>

<div class="container">

<h2 align="center">Search Bus</h2>

<form>

<input type="text" placeholder="From">

<input type="text" placeholder="To">

<input type="date">

<select>
<option>Select Bus Type</option>
<option>Volvo</option>
<option>AC Sleeper</option>
<option>Non AC</option>
<option>Luxury Coach</option>
</select>

<button>Search Bus</button>

</form>

</div>

<div class="container">

<div class="card">

<h2>User Login</h2>

<form>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button>Login</button>

</form>

</div>

<div class="card">

<h2>User Registration</h2>

<form>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="text" placeholder="Phone Number">

<input type="password" placeholder="Password">

<button>Register</button>

</form>

</div>

</div>

<footer>

© 2026 Online Bus Ticket Booking System

</footer>

</body>
</html>
