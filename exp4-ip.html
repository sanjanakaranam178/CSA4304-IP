<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Train Reservation System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f5f9;
}

header{
background:#004080;
color:white;
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
}

nav{
background:#0066cc;
display:flex;
justify-content:center;
}

nav a{
color:white;
padding:18px 20px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
background:#ff9800;
}

.hero{
height:450px;
background:#1e88e5;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
}

.hero h1{
font-size:50px;
}

.hero p{
font-size:22px;
margin-top:15px;
}

.container{
width:90%;
margin:auto;
padding:40px;
}

.card{
background:white;
padding:20px;
margin:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid gray;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#0066cc;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#004080;
}

footer{
background:#004080;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

</style>

</head>

<body>

<header>
🚆 Online Train Reservation System
</header>

<nav>

<a href="#">Home</a>
<a href="#">Search Train</a>
<a href="#">Book Ticket</a>
<a href="#">PNR Status</a>
<a href="#">Login</a>
<a href="#">Register</a>
<a href="#">Admin</a>
<a href="#">Contact</a>

</nav>

<div class="hero">

<h1>Book Your Train Tickets Online</h1>

<p>Fast • Secure • Easy Reservation</p>

</div>

<div class="container">

<div class="card">

<h2>Search Train</h2>

<input type="text" placeholder="From Station">

<input type="text" placeholder="To Station">

<input type="date">

<select>
<option>Select Class</option>
<option>Sleeper</option>
<option>AC 3 Tier</option>
<option>AC 2 Tier</option>
<option>First Class</option>
</select>

<button>Search Train</button>

</div>

<div class="card">

<h2>User Login</h2>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

<div class="card">

<h2>User Registration</h2>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="text" placeholder="Phone Number">

<input type="password" placeholder="Password">

<button>Register</button>

</div>

</div>

<footer>

© 2026 Online Train Reservation System

</footer>

</body>
</html>
